# Sentinel 대시보드 API용 읽기 전용 RBAC (CLAUDE.md "확정된 결정")
# - 동사는 get/list/watch만. create/update/patch/delete, pods/exec, pods/portforward, pods/attach 없음
# - **예외 1건: `pods/log`의 `get`** (logs 기능, 2026-09-25 추가. docs/specs/logs.md, docs/api/logs.md)
#     왜 열었나: 파드가 왜 죽었는지는 상태·이벤트만으로는 알 수 없다. 로그를 보려고 매번
#     터미널로 나가면 대시보드가 "상태만 보는 화면"에서 멈춘다.
#     `follow`(실시간)도 같은 동사라 이것 하나로 정지 조회와 따라가기가 모두 된다.
#     **이것이 전부다** — exec·portforward·attach·쓰기 동사는 여전히 없다(AC-LOG01·02).
#     완화 수단(비밀값이 화면으로 새지 않게 하는 것, docs/specs/logs.md 3.3 / docs/api/logs.md 3절):
#       · 가림(마스킹)은 **서버에서** 한다. 가려지지 않은 원문이 API 프로세스 밖으로 나가지 않는다
#       · 가림을 **끄는 설정이 없다**. 원문 보기 API도 없다
#       · 로그를 DB·디스크·응답 캐시·API 자체 로그 **어디에도 저장하지 않는다**
#       · 로그 본문이 어드바이저 스냅샷·알림 본문으로 나가지 않는다
#       · 가림 처리가 실패하면 그 줄을 통째로 생략한다(fail-closed)
#       · `LOGS_ENABLED=false`로 기능을 끌 수 있고, **클러스터 안 배포(deploy/app.example.yaml)는 끈 것이 기본**이다
#       · `LOG_DENY_NAMESPACES`로 네임스페이스를 차단할 수 있다
#     이 권한을 지우면 로그 기능만 403이 되고 다른 화면은 영향을 받지 않는다.
# - secrets, configmaps 없음 (비밀값을 조회하지 않는다)
# - nodes/proxy 없음 (PVC 사용량은 Prometheus 또는 DB 크기 근사치, PM 결정)
# - replicasets/jobs 없음: 파드의 ownerReference·pod-template-hash로 소속을 해석한다
#
# 적용: kubectl apply -f deploy/rbac.yaml
# 확인: kubectl auth can-i --list --as=system:serviceaccount:sentinel:sentinel-api
---
apiVersion: v1
kind: Namespace
metadata:
  name: sentinel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-api
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/part-of: sentinel
  # aws-cost 기능에 필요한 AWS 읽기 전용 권한을 kOps 클러스터에서 파드에 주는 방법은
  # **확인 필요**(kops-support 명세 U8). 후보: kOps Pod Identity Webhook, 노드 인스턴스 프로파일.
  # 로컬 실행(docker compose)은 ~/.aws 마운트를 그대로 쓰므로 영향이 없다.
  # 어느 방법을 쓰든 권한은 읽기 전용이고 이 RBAC의 리소스·동사는 늘리지 않는다.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-readonly
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/part-of: sentinel
rules:
  # 코어: 노드·파드·네임스페이스·이벤트·PVC·서비스
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
      - events
      - persistentvolumeclaims
      - services
    verbs: ["get", "list", "watch"]
  # 컨테이너 로그 (logs 기능). **get 하나뿐**이고 `follow`도 같은 동사다.
  # list/watch를 주지 않는다 — pods/log에는 의미가 없고, 동사를 늘릴 이유가 되지 않는다.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # 워크로드
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # 인그레스 (비용: 로드밸런서 연결, 어드바이저)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # PodDisruptionBudget (어드바이저 R-PDB)
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # HPA (어드바이저)
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # metrics-server (CPU·메모리 사용량)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-readonly
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/part-of: sentinel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinel-readonly
subjects:
  - kind: ServiceAccount
    name: sentinel-api
    namespace: sentinel
