# 개발용 구성: Postgres + NestJS(api) + Next.js(web)
# 실행: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-dashboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dashboard}
      POSTGRES_DB: ${DB_NAME:-dashboard}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dashboard} -d ${DB_NAME:-dashboard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-dashboard}:${DB_PASSWORD:-dashboard}@db:5432/${DB_NAME:-dashboard}
      CORS_ORIGIN: http://localhost:3000
      # 로컬 개발: 호스트의 kubeconfig를 읽기 전용으로 마운트해서 사용
      # (kubeconfig의 server가 127.0.0.1이면 컨테이너에서 안 닿으므로 host.docker.internal로 바꾼 사본을 쓸 것)
      KUBECONFIG: /kube/config
      EKS_CLUSTER_NAME: ${EKS_CLUSTER_NAME:-}
      SYSTEM_NAMESPACES: ${SYSTEM_NAMESPACES:-kube-system,kube-public,kube-node-lease,amazon-cloudwatch}
      METRICS_INTERVAL_SEC: ${METRICS_INTERVAL_SEC:-15}
      # 모니터링할 DB (모니터링 전용 읽기 계정 sentinel_monitor, port-forward 15432 → host.docker.internal:15432)
      DB_TARGET_NAMESPACE: ${DB_TARGET_NAMESPACE:-}
      DB_TARGET_STATEFULSET: ${DB_TARGET_STATEFULSET:-}
      MONITOR_DB_URL: ${MONITOR_DB_URL:-}
      MONITOR_DB_EXPECTED_STANDBYS: ${MONITOR_DB_EXPECTED_STANDBYS:-}
      DB_HEALTH_INTERVAL_SEC: ${DB_HEALTH_INTERVAL_SEC:-15}
      # 선택: PVC 실제 사용량용 Prometheus
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      SSE_MAX_CLIENTS: ${SSE_MAX_CLIENTS:-20}
      # mock | live (live에서 설정 없는 출처는 "알 수 없음")
      DATA_SOURCE: ${DATA_SOURCE:-mock}
      # AWS: 자격 증명은 아래 ~/.aws 읽기 전용 마운트로 읽는다 (키를 환경 변수로 넣지 않음)
      AWS_REGION: ${AWS_REGION:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      COST_EXPLORER_CACHE_TTL_SEC: ${COST_EXPLORER_CACHE_TTL_SEC:-21600}
      COST_MONTHLY_BUDGET_USD: ${COST_MONTHLY_BUDGET_USD:-}
      COST_EXPLORER_METRIC: ${COST_EXPLORER_METRIC:-}
      COST_EXPLORER_DAILY_CALL_LIMIT: ${COST_EXPLORER_DAILY_CALL_LIMIT:-}
      # 호스트에서 도는 agent-bridge (Claude Code 로그인을 쓰므로 컨테이너 밖에서 실행)
      AGENT_BRIDGE_URL: http://host.docker.internal:3002
      AGENT_BRIDGE_TOKEN: ${AGENT_BRIDGE_TOKEN:-}
      ADVISOR_BRIDGE: ${ADVISOR_BRIDGE:-}
      ADVISOR_OUTPUT_MODE: ${ADVISOR_OUTPUT_MODE:-}
      ADVISOR_SLOW_AFTER_SEC: ${ADVISOR_SLOW_AFTER_SEC:-}
      ADVISOR_TIMEOUT_SEC: ${ADVISOR_TIMEOUT_SEC:-}
      ADVISOR_MAX_BUDGET_USD: ${ADVISOR_MAX_BUDGET_USD:-}
      ADVISOR_MAX_TURNS: ${ADVISOR_MAX_TURNS:-}
      # aws-snapshot-manager: 호스트의 deploy/aws-snapshot/snapshots 만 쓰기 가능하게 마운트한다
      # (deploy/aws-snapshot 전체를 올리지 않는다: .env, .raw/ 가 컨테이너에 보이지 않게)
      AWS_SNAPSHOT_DIR: /data/aws-snapshots
      AWS_SNAPSHOT_LIB_DIR: /opt/aws-snapshot/lib
      AWS_SNAPSHOT_DISPLAY_PATH: deploy/aws-snapshot/snapshots
      AWS_SNAPSHOT_WRITE_ENABLED: ${AWS_SNAPSHOT_WRITE_ENABLED:-}
      AWS_SNAPSHOT_IN_PROGRESS_MIN: ${AWS_SNAPSHOT_IN_PROGRESS_MIN:-}
      AWS_SNAPSHOT_EDIT_MAX_BYTES: ${AWS_SNAPSHOT_EDIT_MAX_BYTES:-}
      AWS_SNAPSHOT_VIEW_MAX_BYTES: ${AWS_SNAPSHOT_VIEW_MAX_BYTES:-}
      AWS_SNAPSHOT_POLL_INTERVAL_SEC: ${AWS_SNAPSHOT_POLL_INTERVAL_SEC:-}
      # k8s-snapshot: 호스트의 deploy/k8s-snapshot/snapshots 만 쓰기 가능하게 마운트한다
      # (deploy/k8s-snapshot 전체를 올리지 않는다: .env 가 컨테이너에 보이지 않게). 드리프트는 위 kubeconfig 의 informer 캐시를 읽는다
      K8S_SNAPSHOT_DIR: /data/k8s-snapshots
      K8S_SNAPSHOT_LIB_DIR: /opt/k8s-snapshot/lib
      K8S_SNAPSHOT_DISPLAY_PATH: deploy/k8s-snapshot/snapshots
      K8S_SNAPSHOT_WRITE_ENABLED: ${K8S_SNAPSHOT_WRITE_ENABLED:-}
      K8S_SNAPSHOT_IN_PROGRESS_MIN: ${K8S_SNAPSHOT_IN_PROGRESS_MIN:-}
      K8S_SNAPSHOT_EDIT_MAX_BYTES: ${K8S_SNAPSHOT_EDIT_MAX_BYTES:-}
      K8S_SNAPSHOT_VIEW_MAX_BYTES: ${K8S_SNAPSHOT_VIEW_MAX_BYTES:-}
      K8S_SNAPSHOT_POLL_INTERVAL_SEC: ${K8S_SNAPSHOT_POLL_INTERVAL_SEC:-}
      K8S_DRIFT_THROTTLE_SEC: ${K8S_DRIFT_THROTTLE_SEC:-}
      K8S_DRIFT_RECOMPUTE_SEC: ${K8S_DRIFT_RECOMPUTE_SEC:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 인증 없는 쓰기 API(스냅샷 파일)가 있으므로 이 PC(127.0.0.1)에서만 연다.
      # web 컨테이너는 내부 주소 http://api:3001 을 쓰므로 영향 없음
      - "127.0.0.1:3001:3001"
    volumes:
      - ./apps/api:/app
      - /app/node_modules          # 컨테이너 안의 node_modules 유지
      - ${KUBECONFIG_HOST_PATH:-~/.kube/config}:/kube/config:ro
      - ${AWS_CONFIG_HOST_PATH:-~/.aws}:/root/.aws:ro
      # aws-snapshot-manager: 스냅샷 폴더(쓰기) + CLI 스캐너 lib(읽기 전용, 규칙을 두 벌로 두지 않기 위해)
      - ${AWS_SNAPSHOT_HOST_DIR:-./deploy/aws-snapshot/snapshots}:/data/aws-snapshots
      - ./deploy/aws-snapshot/lib:/opt/aws-snapshot/lib:ro
      # k8s-snapshot: 스냅샷 폴더(쓰기) + 정리·드리프트 규칙 lib(읽기 전용). 스캐너는 위 aws-snapshot lib 를 같이 쓴다
      - ${K8S_SNAPSHOT_HOST_DIR:-./deploy/k8s-snapshot/snapshots}:/data/k8s-snapshots
      - ./deploy/k8s-snapshot/lib:/opt/k8s-snapshot/lib:ro
    depends_on:
      db:
        condition: service_healthy
    command: npm run start:dev

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      # 브라우저에서 호출할 주소
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # 서버 컴포넌트/Route Handler에서 컨테이너끼리 호출할 주소
      API_INTERNAL_URL: http://api:3001
      WATCHPACK_POLLING: "true"     # Mac/Windows에서 핫리로드 안정화
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev -- -H 0.0.0.0

volumes:
  db-data:
